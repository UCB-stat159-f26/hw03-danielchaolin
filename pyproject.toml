[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Fetch and plot Tennis Abstract career match data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "requests>=2.28",
]

[tool.setuptools.packages.find]
where = ["src"]